# V0.1 演示：使用 Docker Nginx envsubst 模板，宿主机仅监听本机回环地址。
# 上游服务端口占位符会在容器启动时替换。
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    location = /demo/project {
        proxy_pass http://demo:${SCADA_DEMO_PORT}/project;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /demo/events {
        proxy_pass http://demo:${SCADA_DEMO_PORT}/events;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header Cache-Control "no-store" always;
        add_header X-Accel-Buffering "no" always;
    }

    # API 路由不存在时直接返回 404，不返回单页应用 HTML。
    location ^~ /demo/ { return 404; }

    # 仅转发已实现的进程存活检查，不开放尚未实现的 API。
    location = /api/health {
        proxy_pass http://server:${SCADA_SERVER_PORT}/health;
        proxy_http_version 1.1;
        proxy_read_timeout 10s;
    }
    location ^~ /api/ { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
