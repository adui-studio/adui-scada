# V0.1 demonstration only. The host binds 127.0.0.1:8080/8081.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    location = /demo/project {
        proxy_pass http://demo:4178/project;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /demo/events {
        proxy_pass http://demo:4178/events;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header Cache-Control "no-store" always;
        add_header X-Accel-Buffering "no" always;
    }

    # Do not return SPA HTML for missing API endpoints.
    location ^~ /demo/ { return 404; }

    # Only the existing liveness probe is forwarded; no unimplemented APIs.
    location = /api/health {
        proxy_pass http://server:3001/health;
        proxy_http_version 1.1;
        proxy_read_timeout 10s;
    }
    location ^~ /api/ { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
