# ADui SCADA 本机全新安装：单一 Compose 项目、七个容器、一个 PostgreSQL 实例。
# 使用 adui-scada 新卷，不挂载、删除或重命名此前 Docker 项目的持久化数据。
# 保留 HTTP 演示，新增本机 HTTPS 入口；两种协议均不开放 OIDC。
name: adui-scada

services:
  web-react:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.web
      args:
        WEB_APP: web-react
    environment:
      SCADA_SERVER_PORT: "${SCADA_SERVER_PORT:-13001}"
      SCADA_DEMO_PORT: "${SCADA_DEMO_PORT:-14178}"
    ports:
      - "127.0.0.1:${SCADA_REACT_PORT:-18080}:8080"
      - "127.0.0.1:${SCADA_REACT_HTTPS_PORT:-18480}:8443"
    volumes:
      - "${SCADA_LAB_CERT_DIR:?必须先执行 Docker 本机准备脚本}/localhost.pem:/etc/nginx/lab-tls/localhost.pem:ro"
      - "${SCADA_LAB_CERT_DIR:?必须先执行 Docker 本机准备脚本}/localhost-key.pem:/etc/nginx/lab-tls/localhost-key.pem:ro"
    depends_on:
      demo:
        condition: service_healthy
      server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app

  web-vue:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.web
      args:
        WEB_APP: web-vue
    environment:
      SCADA_SERVER_PORT: "${SCADA_SERVER_PORT:-13001}"
      SCADA_DEMO_PORT: "${SCADA_DEMO_PORT:-14178}"
    ports:
      - "127.0.0.1:${SCADA_VUE_PORT:-18081}:8080"
      - "127.0.0.1:${SCADA_VUE_HTTPS_PORT:-18481}:8443"
    volumes:
      - "${SCADA_LAB_CERT_DIR:?必须先执行 Docker 本机准备脚本}/localhost.pem:/etc/nginx/lab-tls/localhost.pem:ro"
      - "${SCADA_LAB_CERT_DIR:?必须先执行 Docker 本机准备脚本}/localhost-key.pem:/etc/nginx/lab-tls/localhost-key.pem:ro"
    depends_on:
      demo:
        condition: service_healthy
      server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app

  server:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.server
    environment:
      NODE_ENV: production
      SCADA_OIDC_ENABLED: "false"
      SCADA_LOCAL_DEMO_API_ENABLED: "false"
      SCADA_SERVER_HOST: 0.0.0.0
      SCADA_SERVER_PORT: "${SCADA_SERVER_PORT:-13001}"
    expose:
      - "${SCADA_SERVER_PORT:-13001}"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+process.env.SCADA_SERVER_PORT+'/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - app
      # 仅用于显式原生只读烟测；默认 HTTP 服务不注册数据库。
      - lab

  demo:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.demo
    environment:
      SCADA_DEMO_HOST: 0.0.0.0
      SCADA_DEMO_PORT: "${SCADA_DEMO_PORT:-14178}"
    expose:
      - "${SCADA_DEMO_PORT:-14178}"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+process.env.SCADA_DEMO_PORT+'/project').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - app

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: adui_scada
      POSTGRES_PASSWORD: "${SCADA_LAB_DB_PASSWORD:?必须先执行 Docker 本机准备脚本}"
      POSTGRES_DB: adui_scada
    ports:
      - "127.0.0.1:${SCADA_LAB_POSTGRES_PORT:-15432}:5432"
    volumes:
      # PostgreSQL 18 及后续版本采用主版本专用数据目录；旧卷须先备份并迁移。
      - postgres-data:/var/lib/postgresql
      - ./oidc-lab/init-keycloak-db.sql:/docker-entrypoint-initdb.d/01-keycloak.sql:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 15
    restart: "no"
    networks: [lab]

  redis:
    image: redis:latest
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${SCADA_LAB_REDIS_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: "no"
    networks: [lab]

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/adui_scada_keycloak
      KC_DB_USERNAME: adui_scada
      KC_DB_PASSWORD: "${SCADA_LAB_DB_PASSWORD:?必须先执行 Docker 本机准备脚本}"
      KC_HOSTNAME: "https://127.0.0.1:${SCADA_LAB_KEYCLOAK_PORT:-18443}"
      KC_HTTP_ENABLED: "false"
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/conf/lab-tls/localhost.pem
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/conf/lab-tls/localhost-key.pem
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${SCADA_LAB_KEYCLOAK_ADMIN_PASSWORD:?必须先执行 Docker 本机准备脚本}"
      SCADA_LAB_CLIENT_SECRET: "${SCADA_LAB_CLIENT_SECRET:?必须先执行 Docker 本机准备脚本}"
      SCADA_REACT_DEV_PORT: "${SCADA_REACT_DEV_PORT:-15173}"
    ports:
      - "127.0.0.1:${SCADA_LAB_KEYCLOAK_PORT:-18443}:8443"
    volumes:
      - "${SCADA_LAB_CERT_DIR:?必须先执行 Docker 本机准备脚本}:/opt/keycloak/conf/lab-tls:ro"
      - ./oidc-lab:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [lab]

volumes:
  # Docker Compose 创建 adui-scada_postgres-data / adui-scada_redis-data。
  # 不读取历史卷，down 默认不会删除卷。
  postgres-data:
  redis-data:

networks:
  app:
    driver: bridge
  lab:
    driver: bridge
