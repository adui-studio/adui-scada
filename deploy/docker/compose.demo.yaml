# ADui SCADA V0.1: localhost demonstration, NOT production deployment.
name: adui-scada-v01-demo
services:
  web-react:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.web
      args:
        WEB_APP: web-react
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      demo:
        condition: service_healthy
      server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app

  web-vue:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.web
      args:
        WEB_APP: web-vue
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      demo:
        condition: service_healthy
      server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app

  server:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.server
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3001"
    expose:
      - "3001"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - app

  demo:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.demo
    environment:
      DEMO_HOST: 0.0.0.0
    expose:
      - "4178"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4178/project').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - app

networks:
  app:
    driver: bridge
