# ADui SCADA V0.1：仅供本机演示，绝不能视为生产部署。
name: adui-scada-v01-demo
services:
  web-react:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.web
      args:
        WEB_APP: web-react
    environment:
      SCADA_SERVER_PORT: "${SCADA_SERVER_PORT:-13001}"
      SCADA_DEMO_PORT: "${SCADA_DEMO_PORT:-14178}"
    ports:
      - "127.0.0.1:${SCADA_REACT_PORT:-18080}:8080"
    depends_on:
      demo:
        condition: service_healthy
      server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app

  web-vue:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.web
      args:
        WEB_APP: web-vue
    environment:
      SCADA_SERVER_PORT: "${SCADA_SERVER_PORT:-13001}"
      SCADA_DEMO_PORT: "${SCADA_DEMO_PORT:-14178}"
    ports:
      - "127.0.0.1:${SCADA_VUE_PORT:-18081}:8080"
    depends_on:
      demo:
        condition: service_healthy
      server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app

  server:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.server
    environment:
      NODE_ENV: production
      SCADA_SERVER_HOST: 0.0.0.0
      SCADA_SERVER_PORT: "${SCADA_SERVER_PORT:-13001}"
    expose:
      - "${SCADA_SERVER_PORT:-13001}"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+process.env.SCADA_SERVER_PORT+'/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - app

  demo:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.demo
    environment:
      SCADA_DEMO_HOST: 0.0.0.0
      SCADA_DEMO_PORT: "${SCADA_DEMO_PORT:-14178}"
    expose:
      - "${SCADA_DEMO_PORT:-14178}"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+process.env.SCADA_DEMO_PORT+'/project').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - app

networks:
  app:
    driver: bridge
