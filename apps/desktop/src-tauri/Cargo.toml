[package]
name = "adui-scada-desktop"
version = "0.1.0"
description = "ADui SCADA 桌面应用外壳"
authors = ["ADui Studio"]
edition = "2024"

[lib]
name = "adui_scada_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "^2.7.6", features = [] }

[dependencies]
tauri = { version = "^2.12.7", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
