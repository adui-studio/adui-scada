packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer
catalog:
  "@types/node": "^24"
  "@types/react": "19.3.0"
  "@types/react-dom": "^19.2.0"
  "@tsconfig/node24": "^24.0.5"
  "@vue/tsconfig": "^0.9.1"
  "@vitejs/plugin-react": "6.2.1"
  "@vitejs/plugin-vue": "6.0.10"
  react: "19.3.1"
  react-dom: "19.3.1"
  vue: "3.5.40"
  vue-tsc: "3.3.13"
  typescript: "6.0.3"
  vite: "npm:@voidzero-dev/vite-plus-core@1.5.0"
  vite-plus: "1.5.0"
  vitest: "5.1.0"
overrides:
  "vite@*": "catalog:"
  "typescript@*": "catalog:"
  "vitest@*": "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
