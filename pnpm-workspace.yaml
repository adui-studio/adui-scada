packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer
catalog:
  "@tailwindcss/vite": "^4.3.5"
  tailwindcss: "^4.3.5"
  "@adui/normalize.css": "^0.1.1"
  "@nestjs/common": "^12.6.0"
  "@nestjs/core": "^12.6.0"
  "@nestjs/config": "^12.1.1"
  "nestjs-pino": "^5.3.2"
  pino: "^10.4.0"
  "pino-pretty": "^13.2.0"
  "pino-http": "^11.0.0"
  "@nestjs/swagger": "^12.1.2"
  "@nestjs/terminus": "^12.2.0"
  helmet: "^8.3.0"
  zod: "^4.6.7"
  "@nestjs/platform-express": "^12.6.0"
  "@nestjs/testing": "^12.6.0"
  "@nestjs/cli": "^12.0.15"
  "@nestjs/schematics": "^12.0.16"
  "@tauri-apps/cli": "^2.12.6"
  "@types/supertest": "^7.2.1"
  reflect-metadata: "^0.2.2"
  rxjs: "^7.8.2"
  supertest: "^7.3.2"
  "@types/node": "^24.19.2"
  "@types/react": "^19.3.0"
  "@types/react-dom": "^19.3.0"
  "@tsconfig/node24": "^24.0.6"
  "@vue/tsconfig": "^0.9.1"
  "@vitejs/plugin-react": "^6.3.0"
  "@vitejs/plugin-vue": "^6.0.11"
  react: "^19.3.1"
  react-dom: "^19.3.1"
  react-router: "^8.5.2"
  vue: "^3.5.46"
  vue-router: "^5.5.1"
  vue-tsc: "^3.3.14"
  typescript: "^6.0.3"
  vite: "npm:@voidzero-dev/vite-plus-core@8.3.8001"
  vite-plus: "^1.8.0"
  vitest: "5.1.1"
  prisma: "8.0.0-rc.35"
  "@prisma/orm-postgres": "8.0.0-rc.25"
  pg: "^8.23.1"
  "@types/pg": "^8.23.1"
  dexie: "^4.4.7"
  fake-indexeddb: "^6.2.8"
  tdesign-react: "^1.18.6"
  tdesign-vue-next: "^1.20.11"
  tdesign-icons-react: "^0.6.12"
  tdesign-icons-vue-next: "^0.4.12"
  openid-client: "^6.9.1"
overrides:
  "vite@*": "catalog:"
  "typescript@*": "catalog:"
  "vitest@*": "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  "@prisma/engines": true
  "@scarf/scarf": true
  esbuild: true
  prisma: true
minimumReleaseAgeExclude:
  - "@voidzero-dev/vite-plus-core@8.3.8001"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.8.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.8.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.8.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.8.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.8.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.8.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.8.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.8.0"
  - vite-plus@1.8.0
permissions:
  "@prisma/orm-postgres":
    skills: true
  prisma:
    skills: true
skills:
  dirs:
    - .agents/skills
